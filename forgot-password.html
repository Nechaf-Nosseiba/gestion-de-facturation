<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">

  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
  <header>
    <h1 class="company-name">الشركة الجزائرية للكهرباء و الغاز - التوزيع</h1>
    <br>
    <h1 class="company-name">Société Algérienne De L'électricité et du Gaz-Distribution</h1>
    <img src="data:image/png;base64,..." alt="Logo Sonelgaz" class="logo">
  </header>

  <div class="forgot-password-page" style="margin-top: 120px;">
    <h2>Mot de passe oublié ?</h2>
    <form action="#" method="post">
      <div class="input-group">
        <label for="email">Entrez votre email</label>
        <input type="email" id="email" name="email" required>
        <i class='bx bxs-envelope'></i>
      </div>
      <button type="submit" class="login-btn">Envoyer</button>
    </form>
    <div class="register-link">
      <p>Retour à la <a href="sonalgaz.html">connexion</a></p>
    </div>
  </div>
